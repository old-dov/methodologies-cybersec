site_name: Wiki Méthodologies Cybersécurité
site_description: Base de connaissances personnelle – Audit, Pentest & Architecture Sécurité
site_author: Muzee
docs_dir: docs
exclude_docs: |
  siem-soc/siem-wazuh.md

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Sécurité Web:
    - Audit IDOR: web/idor.md
    - Lab Decima / Samaritan OS: web/decima-samaritan-idor.md
    - Contournement CSRF: web/csrf.md
    - Bypass Upload Fichiers: web/upload-bypass.md
    - Fuzzing avec ffuf: web/ffuf.md
  - SIEM & SOC:
    - Agent Wazuh – Multi-OS: siem-soc/agent-wazuh.md
    - Analyse de Risques Cyber: siem-soc/analyse-risques.md
  - Bibliothèque:
    - Infrastructure Logs Wazuh: bibliotheque/wazuh-logs-infrastructure.md
    - Flux de Travail Metasploit: bibliotheque/metasploit-workflow.md
    - NIST CSF 2.0 - 6 Fonctions Vitales: bibliotheque/nist-csf-2-fonctions-vitales.md
    - Réseau Windows - AD DNS DHCP: bibliotheque/reseau-windows-ad-dns-dhcp.md
    - Vulnérabilités de Configuration AD: bibliotheque/ad-vulnerabilites-configuration.md
    - Procédures Forensiques Multi-Vecteurs: bibliotheque/forensique-acquisition-analyse-multivecteurs.md
    - Réponse Compromission d'Identifiants: bibliotheque/reponse-compromission-identifiants-phishing.md
    - Investigation Mémoire et Pilotes: bibliotheque/investigation-memoire-audit-pilotes.md
    - Détection d'Intrusion et Processus Critiques: bibliotheque/investigation-intrusion-processus-critiques.md
    - Escalade de Privilèges via les Services Windows: bibliotheque/escalade-privileges-services-windows.md
    - Architecture et Automatisation GPO: bibliotheque/gpo-architecture-automatisation.md
