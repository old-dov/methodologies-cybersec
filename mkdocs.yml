site_name: Wiki Méthodologies Cybersécurité
site_description: Base de connaissances personnelle – Audit, Pentest & Architecture Sécurité
site_author: Muzee
docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Sécurité Web:
    - Audit IDOR: web/idor.md
    - Contournement CSRF: web/csrf.md
    - Bypass Upload Fichiers: web/upload-bypass.md
    - Fuzzing avec ffuf: web/ffuf.md
  - SIEM & SOC:
    - SIEM Wazuh – Architecture Freelance: siem-soc/siem-wazuh.md
    - Agent Wazuh – Multi-OS: siem-soc/agent-wazuh.md
    - Analyse de Risques Cyber: siem-soc/analyse-risques.md
